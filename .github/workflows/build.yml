name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Copy build output to exe directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path exe
          $nsisExe = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsisExe) {
            Copy-Item $nsisExe.FullName -Destination exe/
            Write-Host "Copied NSIS installer: $($nsisExe.Name)"
          }
          $standaloneExe = "src-tauri/target/x86_64-pc-windows-msvc/release/抖音下载器.exe"
          if (Test-Path $standaloneExe) {
            Copy-Item $standaloneExe -Destination exe/
            Write-Host "Copied standalone exe"
          }
          Write-Host "Contents of exe directory:"
          Get-ChildItem exe/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: douyin-downloader-windows
          path: |
            exe/*.exe

      - name: Commit exe to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exe/
          git diff --staged --quiet || git commit -m "build: update Windows build artifacts"
          git push
